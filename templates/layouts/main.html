{% load static %}
<!-- Load static files -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <title>❄️ Frozeria</title>
    <meta content="" name="description" />
    <meta content="" name="keywords" />

    <!-- Google Fonts -->

    <!-- Vendor CSS Files -->
    <!-- Vendor CSS Files -->
    <link
      href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}"
      rel="stylesheet" />
    <link
      href="{% static 'assets/vendor/bootstrap-icons/bootstrap-icons.css' %}"
      rel="stylesheet" />
    <link
      href="{% static 'assets/vendor/boxicons/css/boxicons.min.css' %}"
      rel="stylesheet" />
    <link
      href="{% static 'assets/vendor/quill/quill.snow.css' %}"
      rel="stylesheet" />
    <link
      href="{% static 'assets/vendor/quill/quill.bubble.css' %}"
      rel="stylesheet" />
    <link
      href="{% static 'assets/vendor/remixicon/remixicon.css' %}"
      rel="stylesheet" />
    <!-- <link href="{% static 'assets/vendor/simple-datatables/style.css' %}" rel="stylesheet"> -->
    <!-- Template Main CSS File -->
    <link href="{% static 'assets/css/style.css' %}" rel="stylesheet" />

    <!-- Block for additional CSS -->
    {% block extra_css %} {% endblock %}
  </head>

  <body>
    <!-- ======= Header ======= -->
    {% include 'layouts/navbar.html'%}

    <!-- ======= Sidebar ======= -->
    {% block content %} {% endblock %} 
    {% include 'layouts/footer.html'%}
    <a
      href="#"
      class="back-to-top d-flex align-items-center justify-content-center"
      ><i class="bi bi-arrow-up-short"></i
    ></a>

    <!-- Vendor JS Files -->
    <!-- Vendor JS Files -->
    <script src="{% static 'assets/vendor/datatables/jquery-3.7.0.min.js' %}"></script>
    <script src="{% static 'assets/vendor/apexcharts/apexcharts.min.js' %}"></script>
    <script src="{% static 'assets/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'assets/vendor/chart.js/chart.umd.js' %}"></script>
    <script src="{% static 'assets/vendor/echarts/echarts.min.js' %}"></script>
    <script src="{% static 'assets/vendor/quill/quill.js' %}"></script>
    <!-- <script src="{% static 'assets/vendor/simple-datatables/simple-datatables.js' %}"></script> -->
    <script src="{% static 'assets/vendor/tinymce/tinymce.min.js' %}"></script>
    <script src="{% static 'assets/vendor/php-email-form/validate.js' %}"></script>

    <!-- Template Main JS File -->
    <script src="{% static 'assets/js/main.js' %}"></script>
    <!-- SweetAlert2 harus di-load dulu -->
    <script src="{% static 'assets/vendor/sweetalert2.all.min.js' %}"></script>

    <!-- Block for additional JS -->
    {% block extra_js %} {% endblock %} {% if messages %} {% for message in messages %}
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        Swal.fire({
          icon: "{% if message.tags == 'success' %}success{% else %}error{% endif %}",
          title:
            "{% if message.tags == 'success' %}Berhasil{% else %}Oops...{% endif %}",
          html: "{{ message|escapejs }}",
        });
      });
    </script>
    {% endfor %} {% endif %}
  </body>
</html>
